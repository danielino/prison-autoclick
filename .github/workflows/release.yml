name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install pyinstaller

      - name: Build exe
        run: pyinstaller --onefile --noconsole --name AutoPrison autoprison.py

      - name: Checksum
        shell: pwsh
        run: |
          $h = (Get-FileHash dist/AutoPrison.exe -Algorithm SHA256).Hash.ToLower()
          "$h  AutoPrison.exe" | Out-File dist/AutoPrison.exe.sha256 -Encoding ascii
          "SHA256: $h" >> $env:GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        with:
          name: AutoPrison
          path: dist/AutoPrison.exe*

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/AutoPrison.exe
            dist/AutoPrison.exe.sha256
          generate_release_notes: true
